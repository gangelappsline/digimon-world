<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><title>Digimon World Guide Hub</title>
<script>
// GitHub Pages SPA fallback: redirige cualquier ruta desconocida al index.
// La app usa HashRouter, así que esto es solo una red de seguridad.
var l = window.location;
l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 2).join('/') + '/');
</script></head><body></body></html>
